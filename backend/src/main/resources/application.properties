server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:smart_irrigation}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:boki123}


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

openweather.api.key=${OPENWEATHER_API_KEY:}
openweather.current.url=https://api.openweathermap.org/data/2.5/weather
openweather.forecast.url=https://api.openweathermap.org/data/2.5/forecast
